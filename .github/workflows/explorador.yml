name: Explorador de material (v2)
# Llena la biblioteca de momentos cada noche (00:30 UTC), antes de la sala de redacción.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      animales:
        description: "Animales separados por comas (vacío = los que tienen menos material)"
        required: false
        default: ""
      max_total:
        description: "Tope de clips a analizar con visión"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: datos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # la punta de la rama, con los datos más recientes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-v2.txt
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-v2.txt
      - name: Material para el próximo vídeo largo
        timeout-minutes: 25
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m cf.material_largo --max-total 60
      - name: Nota de espectacularidad a los clips antiguos
        timeout-minutes: 10
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m cf.espectacularidad
      - name: Explorar
        timeout-minutes: 40   # deja tiempo para guardar lo analizado aunque se corte
        continue-on-error: true   # si se corta por tiempo, lo analizado se guarda igual (no es un fallo)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m cf.explorador \
            --animales "${{ github.event.inputs.animales }}" \
            --nuevos 3 --fotos 1 --max-total "${{ github.event.inputs.max_total || '60' }}"
      - name: Guardar la biblioteca en el repositorio
        if: always()   # se guarda lo analizado aunque la exploración falle o se corte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/biblioteca datos/largos
          git diff --cached --quiet && exit 0
          git commit -m "Biblioteca: nuevos momentos analizados"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
