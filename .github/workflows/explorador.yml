name: Explorador de material (v2)
# Llena la biblioteca de momentos. En la rama v2 se lanza al subir cambios para
# probarlo; cuando la v2 pase a main se activará la programación diaria.
on:
  workflow_dispatch:
    inputs:
      animales:
        description: "Animales separados por comas (vacío = los que tienen menos material)"
        required: false
        default: ""
      max_total:
        description: "Tope de clips a analizar con visión"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: datos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-v2.txt
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-v2.txt
      - name: Explorar
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m cf.explorador \
            --animales "${{ github.event.inputs.animales || 'pulpo,lobo,colibrí' }}" \
            --nuevos 5 --max-total "${{ github.event.inputs.max_total || '15' }}"
      - name: Guardar la biblioteca en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/biblioteca
          git diff --cached --quiet && exit 0
          git commit -m "Biblioteca: nuevos momentos analizados"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
