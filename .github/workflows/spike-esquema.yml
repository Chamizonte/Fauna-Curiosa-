name: Prueba esquema en vídeo largo
# Temporal: monta un trozo del largo del 21 con el esquema de Zama, sin subir nada.
on:
  push:
    branches: [largos-esquemas]
    paths: ["spikes/esquema/**", "cf/esquemas.py", "cf/montaje_largo.py", ".github/workflows/spike-esquema.yml"]
jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install -r requirements-v2.txt
          cd remotion && npm install
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -m cf.montaje_largo spikes/esquema/prueba.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-esquema
          path: out/*.mp4
          retention-days: 7
