name: Prueba Explainroo
# Prueba: renderiza una escena explicativa (Zama) con Explainroo y nuestra voz.
# Solo corre en la rama spike-explainroo.
on:
  push:
    branches: [spike-explainroo]
    paths: ["spikes/explainroo/**", ".github/workflows/spike-explainroo.yml"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-v2.txt
      - name: Locución con ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python spikes/explainroo/voz.py spikes/explainroo/zama
      - name: Preparar Explainroo
        run: npx --yes explainroo@0.6.0 doctor --fetch --language es
      - name: Renderizar en dos looks
        run: |
          mkdir -p salida
          for look in midnight chalk; do
            rm -rf "videos/zama-$look"; mkdir -p videos
            cp -r spikes/explainroo/zama "videos/zama-$look"
            npx --yes explainroo@0.6.0 set "videos/zama-$look" theme "$look"
            npx --yes explainroo@0.6.0 voice "videos/zama-$look"
            npx --yes explainroo@0.6.0 check "videos/zama-$look" || echo "::warning::check con avisos ($look)"
            npx --yes explainroo@0.6.0 sheet "videos/zama-$look" || true
            npx --yes explainroo@0.6.0 render "videos/zama-$look"
            npx --yes explainroo@0.6.0 verify "videos/zama-$look" || true
            find "videos/zama-$look" -name "*.mp4" -newer spikes/explainroo/zama/scenes.js -path "*out*" | head -1 | xargs -I{} cp {} "salida/zama-$look.mp4"
            find "videos/zama-$look" \( -name "sheet*.png" -o -name "sheet*.jpg" \) | head -1 | xargs -I{} cp {} "salida/hoja-$look.png" || true
          done
          ls -la salida; find videos -maxdepth 3 | head -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explainroo-zama
          path: |
            salida/
            videos/*/out/
          retention-days: 7
