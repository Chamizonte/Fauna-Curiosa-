name: Publicar short (v2)
# Monta el guion pendiente más antiguo y lo sube a YouTube en público.
# De momento sin horario: la v1 sigue publicando en main. El horario (4 al día)
# se activa al migrar.
on:
  push:
    branches: [v2]
    paths: [".github/workflows/publicar-short.yml"]   # temporal, para la primera prueba
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-v2.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-v2.txt
      - run: npm install
        working-directory: remotion
      - name: Montar y subir
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACIDAD_YOUTUBE: public
        run: python -m cf.publicar_short
      - name: Guardar el registro de publicación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/shorts
          git diff --cached --quiet && { echo "Nada que guardar"; exit 0; }
          git commit -m "Short publicado"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
